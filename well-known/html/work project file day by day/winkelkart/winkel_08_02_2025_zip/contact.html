<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Your Business</title>
    <header >
 
  <style>
 

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
    }

    h2 {
      text-align: center;
      color: #333333;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #333;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }

    input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    input[type="submit"] {
      background-color: #0073e6;
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: #005bb5;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="#" class="header-logo">
          <img src="./assets/images/logo/Winkel_Shop__2_-removebg-preview.png" alt="Winkel's logo" width="200" height="200"></a>
        <h2>Contact Us </h2>
    <form action="send_email.php" method="POST">
      <label>Your Name:
        <input type="text" name="business_name" required>
      </label>

      <label>Address:
        <input type="text" name="address" required>
      </label>

      <label>Phone:
        <input type="text" name="contact_person" required>
      </label>

      <label>Email:
        <input type="email" name="email" required>
      </label>

     
      <label>State:
        <input type="text" name="state">
      </label>

      <label>Country:
        <input type="text" name="country">
      </label>

      <input type="submit" value="Submit">
    </form>
  </div>
  </div>

  

</body>
</html>
